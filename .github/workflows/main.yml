name: Build APK

on:
  push:
  workflow_dispatch:

# A new push cancels an older build that is still waiting or running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/signing
            echo "$KEYSTORE_BASE64" | base64 -d > app/signing/tb2cal.jks
          else
            echo "No KEYSTORE_BASE64 secret: building with a temporary debug key."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TB2Cal-apk
          path: app/build/outputs/apk/release/*.apk
